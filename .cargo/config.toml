# Portable builds: statically link the MSVC CRT + UCRT so the resulting exe has
# no VCRUNTIME140.dll / api-ms-win-crt-* dependency and runs on a bare Windows 11
# (no Visual C++ Redistributable install required).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
